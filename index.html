<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2f92">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="crest.png" type="image/png">
<title>Bytteplan · Bjerke IL J8/J9</title>
<style>
  /* Bjerke IL: klubbblå #1a2f92, rød #de1420, gul #f6d31c (fra klubbemblemet) */
  :root{
    --bg:#0a0f22; --card:#121a36; --card2:#1a2448; --line:#2c3a6b;
    --text:#eef1fa; --dim:#95a1c7; --green:#f6d31c; --green-dk:#1a2f92;
    --amber:#f0b429; --red:#de1420; --blue:#5aa9e6; --ink:#131a3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; overscroll-behavior:none}
  body{padding-bottom:76px}
  header{position:sticky; top:0; z-index:10; background:var(--green-dk);
    padding:10px 14px calc(10px); display:flex; align-items:center; gap:10px;
    padding-top:calc(10px + env(safe-area-inset-top))}
  header .logo{font-size:20px}
  header h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.3px}
  header .sub{font-size:11px; color:#b9c6f2; margin:0}
  main{padding:12px; max-width:560px; margin:0 auto}
  h2{font-size:14px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:18px 0 8px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px}
  button{font:inherit; border:0; border-radius:12px; padding:12px 16px; font-weight:700;
    background:var(--card2); color:var(--text); cursor:pointer; touch-action:manipulation}
  button:active{transform:scale(.97)}
  button.primary{background:var(--green); color:var(--ink)}
  button.warn{background:var(--red); color:#fff}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--dim); font-weight:600}
  button.big{width:100%; padding:16px; font-size:17px}
  button:disabled{opacity:.4}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .grow{flex:1}
  input[type=text],input[type=number],select{font:inherit; background:var(--card2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px; width:100%}
  /* nav */
  nav{position:fixed; bottom:0; left:0; right:0; display:flex; background:#0d1330;
    border-top:1px solid var(--line); z-index:10; padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; border-radius:0; color:var(--dim); font-size:12px;
    padding:10px 0 12px; display:flex; flex-direction:column; align-items:center; gap:3px; font-weight:600}
  nav button .ico{font-size:20px}
  nav button.on{color:var(--green)}
  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{padding:10px 14px; border-radius:999px; background:var(--card2); border:1px solid var(--line);
    font-weight:600; font-size:15px; cursor:pointer; user-select:none}
  .chip.on{background:var(--green); color:var(--ink); border-color:var(--green)}
  .chip.sel{outline:3px solid var(--amber)}
  /* live clock */
  .clockbox{text-align:center; padding:14px 12px}
  .clock{font-size:52px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
  .clock small{font-size:18px; color:var(--dim); font-weight:600}
  .period{color:var(--dim); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px}
  .nextsub{margin-top:6px; font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums}
  .nextsub b{color:var(--text)}
  .due{animation:pulse 1s infinite; color:var(--amber)!important; font-weight:800}
  @keyframes pulse{50%{opacity:.45}}
  /* players */
  .pcard{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line);
    border-radius:12px; padding:10px 12px; margin-bottom:6px; cursor:pointer}
  .pcard.sel{outline:3px solid var(--amber)}
  .pcard .pos{font-size:11px; font-weight:800; letter-spacing:.5px; color:var(--ink); background:var(--green);
    border-radius:6px; padding:3px 7px; min-width:70px; text-align:center}
  .pcard .pos.kpr{background:var(--blue)}
  .pcard .pos.bnk{background:#333f66; color:#cdd6f0}
  .pcard .nm{font-weight:700; font-size:16px; flex:1}
  .pcard .tm{font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right}
  .pcard .tm b{color:var(--text)}
  .subbanner{background:linear-gradient(135deg,#3a2d05,#4a3a06); border:1px solid var(--amber);
    border-radius:14px; padding:12px; margin-bottom:12px}
  .subbanner .mv{font-size:16px; margin:4px 0}
  .subbanner .mv b{color:var(--amber)}
  .loglist{font-size:13px; color:var(--dim); line-height:1.7; font-variant-numeric:tabular-nums}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line)}
  th{color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .posbar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--card2); min-width:80px}
  .posbar i{display:block}
  .legend{display:flex; gap:12px; font-size:11px; color:var(--dim); margin-top:6px; flex-wrap:wrap}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px}
  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:50; display:flex;
    align-items:flex-end; justify-content:center}
  .modal{background:var(--card); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    width:100%; max-width:560px; border:1px solid var(--line)}
  .modal h3{margin:0 0 12px; font-size:17px}
  .modal button{width:100%; margin-bottom:8px; text-align:left; padding:14px 16px}
  .seg{display:flex; background:var(--card2); border-radius:10px; padding:3px; gap:3px}
  .seg button{flex:1; padding:9px 4px; border-radius:8px; background:transparent; font-size:14px; font-weight:600; color:var(--dim)}
  .seg button.on{background:var(--green); color:var(--ink)}
  .segsm{flex-wrap:wrap}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  .nm{overflow-wrap:anywhere;min-width:0}
  .modal{max-height:92dvh;overflow-y:auto}
  summary{cursor:pointer;padding:12px 0}
  .segsm button{font-size:12px; padding:8px 1px}
  .field-label{font-size:12px; color:var(--dim); margin:10px 0 6px; font-weight:700; text-transform:uppercase; letter-spacing:.6px}
  .hint{font-size:13px; color:var(--dim); line-height:1.5}
  .flash{position:fixed; inset:0; background:var(--amber); opacity:0; pointer-events:none; z-index:40}
  .flash.go{animation:fl .5s 3}
  @keyframes fl{50%{opacity:.35}}
</style>
</head>
<body>
<header>
  <img src="crest.png" alt="Bjerke IL" style="height:38px">
  <div style="flex:1"><h1>Bytteplan</h1><p class="sub">Bjerke IL · Kampdag</p></div>
  <button onclick="showHelp()" style="background:rgba(255,255,255,.14); color:#fff; border-radius:50%;
    width:36px; height:36px; padding:0; font-size:18px; font-weight:800">?</button>
</header>
<p id="storage-warning" role="alert" class="card" hidden>Kunne ikke lagre på telefonen. Behold siden åpen og kopier kamprapporten før du lukker.</p>
<main id="main"></main>
<nav id="nav"></nav>
<div class="flash" id="flash"></div>
<div id="modalhost"></div>

<script>
'use strict';
/* ================= data ================= */
const BASE_POS = [
  {k:'F', n:'Forsvar',  c:'#38c172'},
  {k:'V', n:'Venstre',  c:'#5aa9e6'},
  {k:'H', n:'Høyre',    c:'#f0b429'},
  {k:'S', n:'Spiss',    c:'#de1420'},
];
const EXTRA_POS = [
  {k:'FV',n:'Venstre back',c:'#38c172'}, {k:'FH',n:'Høyre back',c:'#63d69b'},
  {k:'M',n:'Midtbane',c:'#b68af0'}, {k:'MV',n:'Venstre midt',c:'#9974dd'},
  {k:'MH',n:'Høyre midt',c:'#cf9aef'}
];
const ALL_POS = [...BASE_POS, ...EXTRA_POS];
const FORMATS = {3:['F','V','H'],5:['F','V','H','S'],7:['FV','FH','V','M','H','S'],9:['FV','F','FH','V','MV','MH','H','S']};
let POS = BASE_POS, POSK = POS.map(p=>p.k);
function formatOf(s){ return Number(s?.format)||5; }
function hasKeeper(s){ return formatOf(s)!==3; }
function positions(s){ return FORMATS[formatOf(s)]; }
function syncPositions(){ POSK=positions(db.match||db.setup); POS=POSK.map(k=>ALL_POS.find(p=>p.k===k)); }
function lengths(s){ return s.periodMinutes || Array(s.periods).fill(s.periodMin); }
function periodLength(m){ return m.periodSeconds?.[m.period-1] ?? m.periodSec; }
const posName = k => (ALL_POS.find(p=>p.k===k)||{}).n || k;
const posColor = k => (ALL_POS.find(p=>p.k===k)||{}).c || '#888';

const LS_KEY = 'bytteplan-v1';
let db = loadDb();
function loadDb(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if(d && Array.isArray(d.roster)){ if(!Array.isArray(d.history)) d.history=[]; return d; }
  }catch(e){}
  return {roster:[], match:null, setup:null, history:[]};
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); document.getElementById('storage-warning').hidden=true; }catch(e){ document.getElementById('storage-warning').hidden=false; } queuePushSync(); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function playerById(id){ return db.roster.find(p=>p.id===id); }
function pname(id){ const p=playerById(id); return p?p.name:'?'; }
function emptyStats(){ return {fieldSec:0, keeperSec:0, matches:0, pos:Object.fromEntries(ALL_POS.map(p=>[p.k,0]))}; }

/* time helpers */
function mmss(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60;
  return m+':' + String(s).padStart(2,'0'); }
function minShort(sec){ return Math.round(sec/60)+"'"; }

/* season pos time incl current match */
function posTotal(m, pid, k){
  const season = (playerById(pid)?.stats?.pos?.[k]) || 0;
  const cur = m ? (m.perPlayer[pid]?.pos?.[k] || 0) : 0;
  return season + cur;
}
function keeperTotal(m, pid){
  const season = (playerById(pid)?.stats?.keeperSec) || 0;
  const cur = m ? (m.perPlayer[pid]?.keeperSec || 0) : 0;
  return season + cur;
}

/* ================= views / router ================= */
let view = db.match ? 'kamp' : 'kamp';
let selected = null;          // tap-to-swap selection {ctx:'live'|'setup', id}
const $ = sel => document.querySelector(sel);
function render(){
  syncPositions();
  renderNav();
  const m = $('#main');
  if(view==='kamp') m.innerHTML = db.match ? liveHtml() : setupHtml();
  else if(view==='hist') m.innerHTML = histHtml();
  save();
}
function renderNav(){
  const items=[['kamp','⚽','Kamp'],['hist','📋','Kamper']];
  $('#nav').innerHTML = items.map(([v,ico,lbl])=>
    `<button class="${view===v?'on':''}" onclick="go('${v}')"><span class="ico">${ico}</span>${lbl}</button>`).join('');
}
function go(v){ view=v; selected=null; render(); }

/* ================= per-match player entry =================
   No roster database to maintain: coach types today's names.
   Previously used names are remembered locally and offered as
   one-tap chips (and carry position stats for smarter suggestions). */
function addTodayPlayer(){
  const el=$('#newname'); const name=(el.value||'').trim();
  if(!name) return;
  let p=db.roster.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!p){
    p={id:uid(), name, stats:emptyStats()};
    db.roster.push(p);
    db.roster.sort((a,b)=>a.name.localeCompare(b.name,'nb'));
  }
  db.setup.present[p.id]=true;
  db.setup.field=null; db.setup.bench=null;
  el.value='';
  render();
  const inp=$('#newname'); if(inp&&inp.focus) inp.focus();
}

/* ================= setup ================= */
function defaultSetup(){
  return {format:5, step:1, periodMinutes:[25,25], present:{}, keeperId:null, opponent:'', periods:2, periodMin:25, breakMin:5, intervalSec:180, subsPer:'auto',
          field:null, bench:null};
}
function setupHtml(){
  if(!db.setup) db.setup = defaultSetup();
  const s = db.setup;
  s.step=s.step||1; s.periodMinutes=lengths(s);
  const presentIds = db.roster.filter(p=>s.present[p.id]).map(p=>p.id);
  const ready = presentIds.length>=formatOf(s) && (!hasKeeper(s) || s.present[s.keeperId]);

  let lineupHtml='';
  if(s.field){
    lineupHtml = `
      <h2>Foreslått oppstilling</h2>
      <div class="card">
        <p class="hint" style="margin-top:0">Trykk på to spillere for å bytte dem om. ${positions(s).length} utespillere starter, resten er byttekø i rekkefølge.</p>
        <div class="field-label">På banen</div>
        ${hasKeeper(s)?keeperCardHtml(s.keeperId,'setup'):''}
        ${s.field.map(f=>setupCard(f.pid,f.pos)).join('')}
        <div class="field-label">Byttekø</div>
        ${s.bench.map((pid,i)=>setupCard(pid,null,i+1)).join('')}
        <div class="row" style="margin-top:10px">
          <button class="ghost grow" onclick="suggestLineup()">↻ Foreslå på nytt</button>
          <button class="ghost grow" onclick="showPlanPreview()">Se bytteplan</button>
        </div>
      </div>
      <button class="big primary" onclick="startMatch()">Start klokka og kampen ▶</button>
      <div style="height:20px"></div>`;
  }

  const progress = `<div class="seg" aria-label="Kampforberedelser">${['Kampen','Spillere','Oppstilling'].map((label,i)=>`<button class="${s.step===i+1?'on':''}" aria-current="${s.step===i+1?'step':'false'}" onclick="setupStep(${i+1})" ${i===2&&!ready?'disabled':''}>${i+1}. ${label}</button>`).join('')}</div>
    <p class="hint" id="setup-summary">${formatOf(s)}er · ${lengths(s).join(' + ')} min · ${lengths(s).reduce((a,b)=>a+b,0)} min spilletid</p>`;
  if(s.step===1) return progress + settingsHtml(s);
  if(s.step===3) return progress + `<h2>Klar til kamp?</h2><p class="hint">${presentIds.length} spillere · ${presentIds.length-formatOf(s)} på benken. Klokka starter når du trykker start.</p>` + `<div id="alert-settings">${alertSettingsHtml()}</div>` + lineupHtml + `<button class="ghost big" onclick="setupStep(2)">← Endre spillere</button>`;
  return progress + `
    <h2>Hvem spiller i dag?</h2>
    <div class="card">
      <div class="row">
        <input type="text" id="newname" aria-label="Spillerens navn" class="grow" placeholder="Skriv navn …" autocomplete="off"
          onkeydown="if(event.key==='Enter')addTodayPlayer()">
        <button class="primary" onclick="addTodayPlayer()">Legg til</button>
      </div>
      ${db.roster.length? `<div class="field-label">Trykk for å velge${db.roster.some(p=>p.stats.matches)? ' (husket fra tidligere kamper)':''}</div>
      <div class="chips">
        ${db.roster.map(p=>`<button class="chip ${s.present[p.id]?'on':''}" aria-pressed="${!!s.present[p.id]}" onclick="togglePresent('${p.id}')">${esc(p.name)}</button>`).join('')}
      </div>`:''}
      <p class="hint" style="margin-bottom:0">${presentIds.length} spillere valgt${presentIds.length>=formatOf(s)?' · '+(presentIds.length-formatOf(s))+' på benken av gangen':''}. Navn lagres kun på denne telefonen.</p>
    </div>

    ${hasKeeper(s)?`<h2>Keeper (1. periode)</h2>
    <div class="card">
      <div class="chips">
        ${presentIds.map(id=>`<button class="chip ${s.keeperId===id?'on':''}" aria-pressed="${s.keeperId===id}" onclick="setKeeper('${id}')">${esc(pname(id))}</button>`).join('')
          || '<p class="hint" style="margin:0">Velg spillere først.</p>'}
      </div>
    </div>

    `:'<p class="hint">3er spilles uten keeper. Alle er med i bytterotasjonen.</p>'}
    ${presentIds.length? `<details><summary>Spillertype og favorittposisjon (valgfritt)</summary>
    <div class="card">
      <p class="hint" style="margin-top:0"><b>🌱 Ny</b>: uerfaren spiller som holder seg til en kjent posisjon så langt det lar seg gjøre – har nok med seg selv.
      <b>Favorittposisjon</b>: brukes bare i siste periode (glimtplassen). Hvem som spiller og hvor lenge påvirkes ikke av noen av delene.</p>
      ${presentIds.map(id=>{
        const p=playerById(id);
        return `<div class="row" style="margin-bottom:6px">
          <span style="flex:1; font-weight:600; min-width:70px">${esc(p.name)}</span>
          <div class="seg segsm" style="flex:2.4">
            <button class="${!p.fav&&!p.ny?'on':''}" onclick="setMode('${id}',null)">–</button>
            <button class="${p.ny?'on':''}" onclick="setMode('${id}','ny')">🌱 Ny</button>
            ${POS.map(ps=>`<button title="${ps.n}" aria-label="Favorittposisjon: ${ps.n}" class="${p.fav===ps.k?'on':''}" onclick="setMode('${id}','${ps.k}')">${ps.n}</button>`).join('')}
          </div></div>`;
      }).join('')}
    </div></details>`:''}

    <button class="big primary" onclick="setupStep(3)" ${ready?'':'disabled'}>Se oppstilling →</button>
    ${ready?'':`<p class="hint" role="status">Velg minst ${formatOf(s)} spillere${hasKeeper(s)?' og en keeper':''} for å komme videre.</p>`}
    <button class="ghost big" onclick="setupStep(1)">← Kampinnstillinger</button>
    <div style="height:20px"></div>`;
}
function numericField(label,key,value,min,max,step=1){
  return `<label class="field-label" style="display:block" for="opt-${key}">${label}</label><input id="opt-${key}" type="number" min="${min}" max="${max}" step="${step}" value="${value}" onchange="setNumber('${key}',this)">`;
}
function settingsHtml(s){
  return `<h2>Sett opp kampen</h2><div class="card">
    <div class="field-label">Spillform</div><div class="seg">${[3,5,7,9].map(n=>`<button class="${formatOf(s)===n?'on':''}" aria-pressed="${formatOf(s)===n}" onclick="setFormat(${n})">${n}er</button>`).join('')}</div>
    <p class="hint">${hasKeeper(s)?'Én keeper inkludert i antallet på banen.':'Tre utespillere, uten keeper.'}</p>
    <label class="field-label" style="display:block" for="opponent">Motstander (valgfritt)</label>
    <input id="opponent" type="text" value="${esc(s.opponent||'')}" placeholder="F.eks. Gjerdrum" onchange="setOpt('opponent',this.value)">
    ${numericField('Antall perioder','periods',s.periods,1,12)}
    <div id="period-fields">${lengths(s).map((n,i)=>numericField('Periode '+(i+1)+' – minutter','period-'+i,n,1,120,.5)).join('')}</div>
    ${numericField('Pause mellom perioder – minutter','breakMin',s.breakMin,0,60,.5)}
    ${numericField('Tid mellom bytter – sekunder','intervalSec',s.intervalSec,10,3600)}
    <p class="hint">Velg tidene selv. 150 sekunder gir bytte hvert 2:30. Pauser teller ikke som spilletid.</p>
    <label class="field-label" style="display:block" for="subs">Spillere per bytte</label><select id="subs" onchange="setOpt('subsPer',this.value==='auto'?'auto':Number(this.value))">
    ${['auto',...positions(s).map((_,i)=>i+1)].map(n=>`<option value="${n}" ${s.subsPer===n?'selected':''}>${n==='auto'?'Auto (opptil 2)':n}</option>`).join('')}</select>
    </div><button class="big primary" onclick="setupStep(2)">Velg spillere →</button>`;
}
function setNumber(key,input){
  if(!input.checkValidity() || !Number.isFinite(input.valueAsNumber)){ input.reportValidity(); return; }
  const value=input.valueAsNumber, s=db.setup;
  if(key.startsWith('period-')) s.periodMinutes[Number(key.slice(7))]=value;
  else if(key==='periods'){ s.periodMinutes=Array.from({length:value},(_,i)=>lengths(s)[i]??lengths(s).at(-1)); s.periods=value; }
  else s[key]=value;
  if(key==='periods') $('#period-fields').innerHTML=lengths(s).map((n,i)=>numericField('Periode '+(i+1)+' – minutter','period-'+i,n,1,120,.5)).join('');
  $('#setup-summary').textContent=`${formatOf(s)}er · ${lengths(s).join(' + ')} min · ${lengths(s).reduce((a,b)=>a+b,0)} min spilletid`;
  save();
}
function setFormat(n){ const s=db.setup; s.format=n; s.field=null; s.bench=null; s.keeperId=null; s.subsPer='auto'; selected=null; render(); }
function setupStep(n){
  if([...document.querySelectorAll('#main input[type=number]')].some(el=>!el.reportValidity())) return;
  const s=db.setup;
  if(n===3){
    const ids=db.roster.filter(p=>s.present[p.id]);
    if(ids.length<formatOf(s)|| (hasKeeper(s)&&!s.present[s.keeperId])) return;
    s.step=3; if(!s.field){ suggestLineup(); window.scrollTo(0,0); return; }
  }
  s.step=n; selected=null; render(); window.scrollTo(0,0);
}
function setupCard(pid, pos, queueNo){
  const selCls = selected && selected.id===pid ? 'sel':'';
  const tag = pos ? `<span class="pos" style="background:${posColor(pos)}">${posName(pos)}</span>`
                  : `<span class="pos bnk">Benk ${queueNo}</span>`;
  return `<div class="pcard ${selCls}" onclick="tapSetup('${pid}')">${tag}<span class="nm">${esc(pname(pid))}${isNy(pid)?' 🌱':''}</span></div>`;
}
function keeperCardHtml(pid, ctx){
  const selCls = selected && selected.id===pid ? 'sel':'';
  return `<div class="pcard ${selCls}" onclick="${ctx==='setup'?`tapSetup('${pid}')`:`tapLive('${pid}')`}">
    <span class="pos kpr">Keeper</span><span class="nm">${esc(pname(pid))}</span>

function togglePresent(id){ const s=db.setup; s.present[id]=!s.present[id];
  if(!s.present[id] && s.keeperId===id) s.keeperId=null; s.field=null; s.bench=null; render(); }
function setKeeper(id){ db.setup.keeperId=id; db.setup.field=null; db.setup.bench=null; render(); }
function setOpt(k,v){ db.setup[k]=v; save(); }
function setMode(pid,v){
  const p=playerById(pid); if(!p) return;
  if(v==='ny'){ p.ny=true; p.fav=null; }
  else { p.ny=false; p.fav=v; }
  render();

function suggestLineup(){
  const s=db.setup;
  const out = db.roster.filter(p=>s.present[p.id] && p.id!==s.keeperId).map(p=>p.id);
  // least season playing time starts; shuffle equals
  out.sort((a,b)=>{
    const ta=playerById(a).stats.fieldSec, tb=playerById(b).stats.fieldSec;
    return ta!==tb ? ta-tb : Math.random()-0.5;
  });
  const starters = out.slice(0,positions(s).length);
  // greedy global assignment: least-played position first –
  // except 🌱 players, who are seeded where they have played MOST (their anchor)
  let pairs=[];
  starters.forEach(pid=>POSK.forEach(k=>pairs.push({pid,k,
    t: isNy(pid) ? -posTotal(null,pid,k) : posTotal(null,pid,k)})));
  pairs.sort((a,b)=>a.t-b.t || Math.random()-0.5);
  const usedP=new Set(), usedK=new Set(), field=[];
  for(const pr of pairs){
    if(usedP.has(pr.pid)||usedK.has(pr.k)) continue;
    usedP.add(pr.pid); usedK.add(pr.k);
    field.push({pid:pr.pid, pos:pr.k});
  }
  field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
  s.field=field; s.bench=out.slice(positions(s).length);
  selected=null; render();
}
function tapSetup(pid){
  const s=db.setup;
  if(!selected){ selected={ctx:'setup', id:pid}; render(); return; }
  if(selected.id===pid){ selected=null; render(); return; }
  const a=selected.id, b=pid; selected=null;
  swapInLineup(s, a, b); render();
}
function swapInLineup(s, a, b){
  const loc = pid => {
    if(s.keeperId===pid) return {t:'k'};
    const fi=s.field.findIndex(f=>f.pid===pid); if(fi>=0) return {t:'f',i:fi};
    const bi=s.bench.indexOf(pid); return {t:'b',i:bi};
  };
  const la=loc(a), lb=loc(b);
  const put=(l,pid)=>{ if(l.t==='k')s.keeperId=pid; else if(l.t==='f')s.field[l.i].pid=pid; else s.bench[l.i]=pid; };
  put(la,b); put(lb,a);
}

/* ================= sub engine ================= */
function subsCount(m){
  if(m.bench.length===0) return 0;
  const want = m.subsPer==='auto' ? Math.min(2, m.bench.length) : m.subsPer;
  return Math.max(1, Math.min(want, m.bench.length, m.field.length));
}
/* Core sub planner, shared by live view and plan preview.
   field: [{pid,pos,stint}], bench: [pid], ptot(pid,posK) = accumulated time in position.
   Outs = longest current stint (fairness). Ins take their least-played position
   globally – if a staying player holds it, that player shifts to a vacated spot.
   The epsilon prefers vacated positions on ties to avoid needless shuffling.
   pref (optional, pid→posK): preferred position that trumps the least-played
   rule – favourite (final period only) or a 🌱-player's anchor (whole match).
   sticky (optional, pid→bool): 🌱 players – their held position is locked so
   incoming players won't displace them. Never affects who plays or how long. */
function planSub(field, bench, S, ptot, pref, sticky){
  const POSK=field.map(f=>f.pos);
  S=Math.min(S,field.length,bench.length);
  pref = pref || (()=>null);
  sticky = sticky || (()=>false);
  const outs=[...field].sort((a,b)=>b.stint-a.stint).slice(0,S);
  const outSet=new Set(outs.map(o=>o.pid));
  const stayers=field.filter(f=>!outSet.has(f.pid));
  const ins=bench.slice(0,S);
  const vacated=new Set(outs.map(o=>o.pos));
  const lockedPos=new Set(stayers.filter(s=>sticky(s.pid)).map(s=>s.pos));
  const taken=new Set();
  // sticky (🌱) players pick first so a teammate entering in the same sub
  // can't snatch their anchor position
  const assign={};
  [...ins].sort((a,b)=>(sticky(b)?1:0)-(sticky(a)?1:0)).forEach(pid=>{
    let best=null;
    for(const k of POSK){
      if(taken.has(k)) continue;
      let score=ptot(pid,k)+(vacated.has(k)?0:0.001);
      if(pref(pid)===k) score-=1e7;
      if(lockedPos.has(k)) score+=2e7;
      if(!best||score<best.score) best={k,score};
    }
    taken.add(best.k);
    assign[pid]=best.k;
  });
  const moves=ins.map((pid,i)=>({inPid:pid, outPid:outs[i].pid, pos:assign[pid]}));
  const kept=new Set(stayers.filter(s=>!taken.has(s.pos)).map(s=>s.pos));
  const freePos=POSK.filter(k=>!taken.has(k)&&!kept.has(k));
  const shifts=[];
  stayers.filter(s=>taken.has(s.pos)).forEach(s=>{
    let best=null;
    for(const k of freePos){
      if(shifts.some(x=>x.to===k)) continue;
      let score=ptot(s.pid,k);
      if(pref(s.pid)===k) score-=1e7;
      if(!best||score<best.score) best={k,score};
    }
    if(best) shifts.push({pid:s.pid, from:s.pos, to:best.k});
  });
  return {moves, shifts};
}
function favActive(m){ return m.period===m.periods; }
function favOf(pid){ return playerById(pid)?.fav || null; }
function isNy(pid){ return !!(playerById(pid)||{}).ny; }
/* a 🌱 player's anchor: current position if on the field,
   otherwise the position they have most time in (match + season) */
function anchorOf(m,pid){
  const f=m.field.find(x=>x.pid===pid);
  if(f) return f.pos;
  let best=null, bt=0;
  POSK.forEach(k=>{ const t=posTotal(m,pid,k); if(t>bt){ bt=t; best=k; } });
  return best;
}
function computeNextSub(m){
  if(m.finished||m.awaitingPeriod) return null;
  if(m.bench.length===0){
    // no bench: rotate positions among the non-🌱 players so they still get variety
    const rot=m.field.filter(f=>!isNy(f.pid));
    if(rot.length<2) return {rotation:true, moves:[]};
    const moves = rot.map((f,i)=>({rotPid:f.pid, from:f.pos, to:rot[(i+1)%rot.length].pos}));
    return {rotation:true, moves};
  }
  const S=subsCount(m);
  const field=m.field.map(f=>({pid:f.pid,pos:f.pos,stint:m.perPlayer[f.pid].stintSec}));
  const pref=pid=> isNy(pid) ? anchorOf(m,pid) : (favActive(m)?favOf(pid):null);
  return planSub(field, m.bench, S, (pid,k)=>posTotal(m,pid,k), pref, isNy);
}
function subMovesHtml(ns){
  if(ns.rotation) return `<div class="mv">${ns.moves.length?'Ingen benk – rullér posisjoner:':'Ingen benk, og 🌱-spillerne står i ro – ingen rotasjon.'}</div>` +
    ns.moves.map(mv=>`<div class="mv"><b>${esc(pname(mv.rotPid))}</b>: ${posName(mv.from)} → ${posName(mv.to)}</div>`).join('') +
    `<div class="row" style="margin-top:8px"><button class="grow primary" onclick="execSub()">${ns.moves.length?'Utført ✓':'OK ✓'}</button></div>`;
  return ns.moves.map(mv=>`<div class="mv">🟢 <b>${esc(pname(mv.inPid))}</b> inn som ${posName(mv.pos)} — 🔴 ${esc(pname(mv.outPid))} ut</div>`).join('')
    + (ns.shifts||[]).map(sh=>`<div class="mv">↔️ ${esc(pname(sh.pid))} flytter til ${posName(sh.to)}</div>`).join('');
}
function execSub(){
  tick();
  const m=curMatch(); const ns=computeNextSub(m); if(!ns) return;
  if(ns.rotation){
    const posByPid={}; ns.moves.forEach(mv=>posByPid[mv.rotPid]=mv.to);
    m.field.forEach(f=>{ if(posByPid[f.pid]) f.pos=posByPid[f.pid]; });
    logIt(ns.moves.length?'Posisjonsrullering utført.':'Ingen rotasjon (🌱-spillere står i ro).');
  } else {
    const outPids=ns.moves.map(mv=>mv.outPid);
    m.field = m.field.filter(f=>!outPids.includes(f.pid));
    ns.moves.forEach(mv=>{
      m.bench=m.bench.filter(x=>x!==mv.inPid);
      m.field.push({pid:mv.inPid,pos:mv.pos});
      m.perPlayer[mv.inPid].stintSec=0;
      logIt(pname(mv.inPid)+' inn ('+posName(mv.pos)+') for '+pname(mv.outPid));
    });
    (ns.shifts||[]).forEach(sh=>{
      const f=m.field.find(x=>x.pid===sh.pid);
      if(f){ f.pos=sh.to; logIt(pname(sh.pid)+' flyttet til '+posName(sh.to)); }
    });
    // outs to back of queue, least total played comes back first
    outPids.sort((a,b)=>m.perPlayer[a].fieldSec-m.perPlayer[b].fieldSec)
      .forEach(pid=>m.bench.push(pid));
    m.field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
  }
  m.lastSubTotal=m.totalSec; m.snoozeSec=0; dueAlerted=false;
  clearMatchNotifications();
  render();
}
function snooze(){ clearMatchNotifications(); const m=curMatch(); m.snoozeSec+=60; dueAlerted=false; render(); }
function goal(side,d){
  const m=curMatch(); if(!m) return;
  if(side==='for') m.goalsFor=Math.max(0,(m.goalsFor||0)+d);
  else m.goalsAgainst=Math.max(0,(m.goalsAgainst||0)+d);
  if(d>0) logIt('⚽ Mål til '+(side==='for'?'Bjerke':(m.opponent||'motstander'))+' — '+(m.goalsFor||0)+'–'+(m.goalsAgainst||0));
  render();
}
function setSubsPerLive(v){
  const m=curMatch(); if(!m) return;
  m.subsPer=v;
  logIt('Spillere per bytte satt til '+(v==='auto'?'auto':v)+'.');
  render();
}

/* ================= live interactions ================= */
function tapLive(pid){
  const m=curMatch();
  if(selected && selected.id!==pid){
    // swap two selected players manually
    manualSwap(selected.id,pid); selected=null; render(); return;
  }
  if(selected && selected.id===pid){ selected=null; render(); return; }
  openPlayerModal(pid);
}
function manualSwap(a,b){
  tick();
  const m=curMatch();
  const loc=pid=>{
    if(m.keeperId===pid) return {t:'k'};
    const fi=m.field.findIndex(f=>f.pid===pid); if(fi>=0) return {t:'f',i:fi};
    const bi=m.bench.indexOf(pid); if(bi>=0) return {t:'b',i:bi};
    return null;
  };
  const la=loc(a), lb=loc(b); if(!la||!lb) return;
  const put=(l,pid)=>{ if(l.t==='k')m.keeperId=pid; else if(l.t==='f')m.field[l.i].pid=pid; else m.bench[l.i]=pid; };
  put(la,b); put(lb,a);
  // reset stint for anyone entering the field or goal
  [[la,b],[lb,a]].forEach(([l,pid])=>{ if(l.t==='f'||l.t==='k') m.perPlayer[pid].stintSec=0; });
  if(la.t==='k'||lb.t==='k') m.perPlayer[m.keeperId].wasKeeper=true;
  logIt('Manuelt bytte: '+pname(a)+' ↔ '+pname(b));
}
function openPlayerModal(pid){
  const m=curMatch();
  const onField=m.field.some(f=>f.pid===pid);
  const isKeeper=m.keeperId===pid;
  const onBench=m.bench.includes(pid);
  let btns='';
  if(onField){
    btns += m.bench.length? `<button class="warn" onclick="injurySub('${pid}')">🚑 Skade – ut nå (${esc(pname(m.bench[0]))} inn)</button>`:'';
    btns += m.bench.length? `<button onclick="tiredSub('${pid}')">😮‍💨 Sliten – kort pause (inn igjen ved neste bytte)</button>`:'';
    btns += `<button onclick="startSwapSel('${pid}')">🔁 Bytt plass med … (trykk på en annen)</button>`;
    btns += !hasKeeper(m)?'':`<button onclick="makeKeeper('${pid}')">🧤 Gjør til keeper</button>`;
    btns += `<button class="warn ghost" onclick="markUnavailable('${pid}')">Sett som utilgjengelig</button>`;
  } else if(onBench){
    btns += `<button onclick="benchToFront('${pid}')">⏫ Flytt fremst i køen</button>`;
    btns += `<button onclick="startSwapSel('${pid}')">🔁 Bytt plass med … (trykk på en annen)</button>`;
    btns += !hasKeeper(m)?'':`<button onclick="makeKeeper('${pid}')">🧤 Gjør til keeper</button>`;
    btns += `<button class="warn ghost" onclick="markUnavailable('${pid}')">Sett som utilgjengelig</button>`;
  } else if(isKeeper){
    btns += `<button onclick="openKeeperModal()">🧤 Bytt keeper</button>`;
    btns += `<button onclick="startSwapSel('${pid}')">🔁 Bytt plass med … (trykk på en annen)</button>`;
  }
  showModal(`<h3>${esc(pname(pid))}</h3>${btns}<button class="ghost" onclick="closeModal()">Avbryt</button>`);
}
function startSwapSel(pid){ closeModal(); selected={ctx:'live', id:pid}; render(); }
function injurySub(pid){
  tick();
  closeModal();
  const m=curMatch();
  const f=m.field.find(x=>x.pid===pid); if(!f||!m.bench.length) return;
  const inPid=m.bench.shift();
  m.field=m.field.filter(x=>x.pid!==pid);
  m.field.push({pid:inPid,pos:f.pos});
  m.field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
  m.perPlayer[inPid].stintSec=0;
  m.unavailable.push(pid);
  (m.injuries=m.injuries||[]).push({name:pname(pid), t:m.totalSec});
  logIt('🚑 '+pname(pid)+' ut (skade). '+pname(inPid)+' inn ('+posName(f.pos)+').');
  render();
}
function tiredSub(pid){
  tick();
  closeModal();
  const m=curMatch();
  const f=m.field.find(x=>x.pid===pid); if(!f||!m.bench.length) return;
  const inPid=m.bench.shift();
  m.field=m.field.filter(x=>x.pid!==pid);
  m.field.push({pid:inPid,pos:f.pos});
  m.field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
  m.perPlayer[inPid].stintSec=0;
  m.bench.unshift(pid); // kort pause: fremst i køen, inn igjen ved neste bytte
  logIt('😮‍💨 '+pname(pid)+' tar en pust. '+pname(inPid)+' inn ('+posName(f.pos)+').');

function markUnavailable(pid){
  tick();
  closeModal();
  const m=curMatch();
  if(m.field.some(f=>f.pid===pid)){ injurySubNoLog(pid); }
  m.bench=m.bench.filter(x=>x!==pid);
  if(!m.unavailable.includes(pid)) m.unavailable.push(pid);
  logIt(pname(pid)+' satt som utilgjengelig.');
  render();
}
function injurySubNoLog(pid){
  const m=curMatch();
  const f=m.field.find(x=>x.pid===pid); if(!f) return;
  m.field=m.field.filter(x=>x.pid!==pid);
  if(m.bench.length){
    const inPid=m.bench.shift();
    m.field.push({pid:inPid,pos:f.pos});
    m.perPlayer[inPid].stintSec=0;
    logIt(pname(inPid)+' inn ('+posName(f.pos)+').');
  }
  m.field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
}
function restorePlayer(pid){
  tick();
  const m=curMatch();
  m.unavailable=m.unavailable.filter(x=>x!==pid);
  const missing=positions(m).find(k=>!m.field.some(f=>f.pos===k));
  if(!m.unavailable.includes(pid) && (m.field.some(f=>f.pid===pid)||m.bench.includes(pid))) return;
  if(missing){ m.field.push({pid,pos:missing}); m.perPlayer[pid].stintSec=0; }
  else m.bench.push(pid);
  m.field.sort((a,b)=>positions(m).indexOf(a.pos)-positions(m).indexOf(b.pos));
  logIt(pname(pid)+' tilbake i byttekøen.');
  render();
}
function benchToFront(pid){
  closeModal();
  const m=curMatch();
  m.bench=m.bench.filter(x=>x!==pid); m.bench.unshift(pid);
  render();
}
function makeKeeper(pid){
  tick();
  closeModal();
  const m=curMatch();
  if(!hasKeeper(m)||pid===m.keeperId||m.unavailable.includes(pid)) return;
  const old=m.keeperId;
  const f=m.field.find(x=>x.pid===pid);
  if(f){ // field player becomes keeper; old keeper takes their position
    m.field=m.field.filter(x=>x.pid!==pid);
    m.field.push({pid:old,pos:f.pos});
    m.field.sort((a,b)=>POSK.indexOf(a.pos)-POSK.indexOf(b.pos));
    m.perPlayer[old].stintSec=0;
  } else { // bench player becomes keeper; old keeper to back of queue
    m.bench=m.bench.filter(x=>x!==pid);
    m.bench.push(old);
  }
  m.keeperId=pid;
  m.perPlayer[pid].stintSec=0;
  m.perPlayer[pid].wasKeeper=true;
  logIt('🧤 '+pname(pid)+' er ny keeper (var: '+pname(old)+').');
  render();
}
function keeperSuggestionText(m){
  const cands=[...m.field.map(f=>f.pid), ...m.bench]
    .sort((a,b)=>keeperTotal(m,a)-keeperTotal(m,b) || m.perPlayer[b].fieldSec-m.perPlayer[a].fieldSec);
  return cands.length? 'Forslag til ny keeper: <b>'+esc(pname(cands[0]))+'</b> (minst keepertid).' : '';
}
function openKeeperModal(){
  const m=curMatch();
  const cands=[...m.field.map(f=>f.pid), ...m.bench]
    .sort((a,b)=>keeperTotal(m,a)-keeperTotal(m,b));

}

/* ================= clock ================= */
let lastTick=null, dueAlerted=false, saveCounter=0;
function toggleRun(force){
  tick();
  const m=curMatch(); if(!m||m.finished||m.awaitingPeriod) return;
  m.running = force===true ? true : force===false ? false : !m.running;
  lastTick=Date.now(); m.lastTickAt=lastTick;
  if(m.running){ requestWakeLock(); initAudio(); logIt('Klokka startet.'); }
  else { releaseWakeLock(); clearMatchNotifications(); logIt('Klokka pauset.'); }
  render();
}
function startNextPeriod(){
  const m=curMatch();
  if(!m?.awaitingPeriod||m.period>=m.periods) return;
  clearMatchNotifications(); initAudio();
  m.period++; m.clockSec=0; m.awaitingPeriod=false; m.breakEndsAt=null;
  m.lastSubTotal=m.totalSec; m.snoozeSec=0; dueAlerted=false;
  // fresh stints for new period
  m.field.forEach(f=>m.perPlayer[f.pid].stintSec=0);
  m.running=true; lastTick=Date.now(); m.lastTickAt=lastTick;
  requestWakeLock();
  logIt('Periode '+m.period+' startet.');
  render();
}
function tick(){
  const m=curMatch();
  if(!m){ lastTick=null; return; }
  if(m.awaitingPeriod && m.breakEndsAt){
    // pauseklokke på veggtid – går riktig selv om telefonen har vært låst
    const left=Math.ceil((m.breakEndsAt-Date.now())/1000);
    const el=$('#breakleft');
    if(el) el.textContent=mmss(Math.max(0,left));
    if(left<=0 && !m.breakAlerted){
      m.breakAlerted=true;
      logIt('Pausen er over!');
      alertUser('Pausen er over', 'Åpne Bytteplan og start neste periode.'); render(); save();
    }
    lastTick=null; return;
  }
  if(!m.running){ lastTick=null; return; }
  const now=Date.now();
  const previous=m.lastTickAt??lastTick??now;
  const dt=Math.min((now-previous)/1000, Math.max(0,periodLength(m)-m.clockSec));
  lastTick=now; m.lastTickAt=now;
  if(dt<=0) return;
  m.clockSec+=dt; m.totalSec+=dt;
  m.field.forEach(f=>{
    const pp=m.perPlayer[f.pid];
    pp.fieldSec+=dt; pp.stintSec+=dt; pp.pos[f.pos]=(pp.pos[f.pos]||0)+dt;
  });
  if(m.keeperId){ m.perPlayer[m.keeperId].keeperSec+=dt; m.perPlayer[m.keeperId].stintSec+=dt; }
  m.bench.forEach(pid=>m.perPlayer[pid].benchSec+=dt);

  // period end?
  if(m.clockSec>=periodLength(m)){
    m.running=false;
    if(m.period>=m.periods){ m.finished=true; logIt('Kampslutt!'); }
    else {
      m.awaitingPeriod=true;
      m.breakEndsAt=previous+dt*1000+(m.breakSec??300)*1000;
      m.breakAlerted=false;
      logIt('Periode '+m.period+' ferdig. Pause '+mmss(m.breakSec??300)+'.');
    }
    if(m.finished) releaseWakeLock();
    alertUser(m.finished?'Kampslutt':'Perioden er ferdig',m.finished?'Åpne Bytteplan for å lagre kampen.':'Pause. Åpne Bytteplan før neste periode.'); render(); return;
  }
  // sub due?
  const left=(m.lastSubTotal+m.intervalSec+m.snoozeSec)-m.totalSec;
  if(left<=0 && !dueAlerted){
    dueAlerted=true;
    const key=`${m.period}:${m.lastSubTotal+m.intervalSec+m.snoozeSec}`;
    if(m.lastAlertKey!==key){ m.lastAlertKey=key; alertUser('Byttetid', 'Åpne Bytteplan og bekreft byttet ved neste døde ball.'); }
    render();
  }
  else if(left>0) dueAlerted=false;

  // lightweight per-tick UI update
  const c=$('#clock'), n=$('#nextsub');
  if(c) c.innerHTML=mmss(m.clockSec)+'<small> / '+mmss(periodLength(m))+'</small>';
  if(n && !m.awaitingPeriod && !m.finished){
    if(left<=0){ n.classList.add('due'); n.textContent='BYTTE NÅ'; }
    else { n.classList.remove('due'); n.innerHTML='Neste bytte om <b>'+mmss(left)+'</b>'; }
  }
  document.querySelectorAll('[data-player-time]').forEach(el=>{
    const pid=el.dataset.playerTime, pp=m.perPlayer[pid];
    if(!pp) return;
    el.innerHTML=pid===m.keeperId?`<b>${mmss(pp.keeperSec)}</b> i mål`:
      m.bench.includes(pid)?`spilt <b>${mmss(pp.fieldSec)}</b>`:
      `inne <b>${mmss(pp.stintSec)}</b><br>tot ${mmss(pp.fieldSec)}`;
  });
  const fairness=$('#live-fairness'); if(fairness) fairness.innerHTML=fairnessTable(m);
  if(++saveCounter>=10){ saveCounter=0; save(); }
}
setInterval(tick,500);

/* ================= end match ================= */
function endMatch(){
  tick();
  const m=curMatch(); if(!m) return;
  const players=[];
  Object.entries(m.perPlayer).forEach(([pid,pp])=>{
    const p=playerById(pid); if(!p) return;
    p.stats.fieldSec+=pp.fieldSec;
    p.stats.keeperSec+=pp.keeperSec;
    p.stats.matches=(p.stats.matches||0)+1;
    ALL_POS.forEach(({k})=>p.stats.pos[k]=(p.stats.pos[k]||0)+(pp.pos[k]||0));
    players.push({name:p.name, fieldSec:pp.fieldSec, keeperSec:pp.keeperSec, pos:{...pp.pos}});
  });
  players.sort((a,b)=>(b.fieldSec+b.keeperSec)-(a.fieldSec+a.keeperSec));
  db.history.unshift({format:formatOf(m), periodSeconds:m.periodSeconds||Array(m.periods).fill(m.periodSec), date:new Date().toISOString(), durationSec:m.totalSec, players,
    opponent:m.opponent||'', goalsFor:m.goalsFor||0, goalsAgainst:m.goalsAgainst||0,
    injuries:(m.injuries||[]).map(x=>({name:x.name,t:x.t})), log:[...m.log].reverse()});
  if(db.history.length>40) db.history.pop();
  db.match=null; db.setup=null;
  releaseWakeLock(); clearMatchNotifications();
  view='hist'; render();
  openReport(0); // vis delbar kamprapport med en gang
}

/* ================= plan preview ================= */
function simulatePlan(s){
  const sim={format:formatOf(s), field:s.field.map(f=>({...f})),bench:[...s.bench],
    perPlayer:{},period:1,periods:s.periods,subsPer:s.subsPer,finished:false,awaitingPeriod:false};
  const all=[...sim.field.map(f=>f.pid),...sim.bench];
  all.forEach(pid=>sim.perPlayer[pid]={...emptyStats(),stintSec:0});
  const events=[]; let total=0;
  const credit=dt=>sim.field.forEach(f=>{
    const pp=sim.perPlayer[f.pid]; pp.fieldSec+=dt; pp.stintSec+=dt; pp.pos[f.pos]+=dt;
  });
  lengths(s).forEach((minutes,i)=>{
    sim.period=i+1; sim.field.forEach(f=>sim.perPlayer[f.pid].stintSec=0);
    let elapsed=0; const duration=minutes*60;
    while(elapsed+s.intervalSec<duration){
      credit(s.intervalSec); elapsed+=s.intervalSec;
      const plan=computeNextSub(sim), parts=[];
      if(plan.rotation){
        plan.moves.forEach(mv=>{sim.field.find(f=>f.pid===mv.rotPid).pos=mv.to;});
        parts.push(plan.moves.length?'Rullér posisjoner':'Ingen rotasjon');
      } else {
        const outs=plan.moves.map(mv=>mv.outPid);
        sim.field=sim.field.filter(f=>!outs.includes(f.pid));
        plan.moves.forEach(mv=>{
          sim.field.push({pid:mv.inPid,pos:mv.pos}); sim.perPlayer[mv.inPid].stintSec=0;
          sim.bench=sim.bench.filter(pid=>pid!==mv.inPid);
          parts.push(esc(pname(mv.inPid))+' inn ('+posName(mv.pos)+') for '+esc(pname(mv.outPid)));
        });
        plan.shifts.forEach(sh=>{sim.field.find(f=>f.pid===sh.pid).pos=sh.to;parts.push(esc(pname(sh.pid))+' → '+posName(sh.to));});
        outs.sort((a,b)=>sim.perPlayer[a].fieldSec-sim.perPlayer[b].fieldSec).forEach(pid=>sim.bench.push(pid));
        sim.field.sort((a,b)=>positions(s).indexOf(a.pos)-positions(s).indexOf(b.pos));
      }
      events.push({t:total+elapsed,period:i+1,local:elapsed,txt:parts.join(' · ')});
    }
    credit(duration-elapsed); total+=duration;
  });
  return {events,all,sim,total};
}
function showPlanPreview(){
  const {events,all,sim}=simulatePlan(db.setup);
  const rows=all.map(pid=>`<tr><td>${esc(pname(pid))}</td><td class="num">${mmss(sim.perPlayer[pid].fieldSec)}</td></tr>`).join('');
  showModal(`<h3>Bytteplan (veiledende)</h3><div style="max-height:60vh;overflow-y:auto">
    <table>${events.slice(0,200).map(e=>`<tr><td>Periode ${e.period}<br>${mmss(e.local)}</td><td>${e.txt}</td></tr>`).join('')}</table>
    ${events.length>200?'<p class="hint">Viser de første 200 byttene. Alle er med i beregnet spilletid.</p>':''}
    <h2>Beregnet spilletid (utespill)</h2><table>${rows}</table>
    <p class="hint">Forutsetter bytter til oppsatt tid${hasKeeper(db.setup)?' og samme keeper hele kampen':''}. Pauser er ikke med. Keeperbytter og manuelle endringer påvirker fordelingen.</p></div>
    <button class="ghost" onclick="closeModal()">Lukk</button>`);
}

  return `<div class="posbar">${segs.map(x=>`<i style="width:${Math.round(100*x.s/tot)}%;background:${posColor(x.k)}"></i>`).join('')}</div>`;
}

      <div style="padding:0 12px 12px">

function copyReport(i,btn){

  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>{ prompt('Kopier teksten:', txt); });
  } else prompt('Kopier teksten:', txt);

function clearHistory(){
  if(db.match){ showModal('<h3>Avslutt kampen først</h3><p class="hint">Spillerne brukes i kampen som pågår.</p><button onclick="closeModal()">Lukk</button>'); return; }
  if(!confirm('Slette all kamphistorikk og alle huskede navn?')) return;
  db.history=[]; db.roster=[]; db.setup=null;
  render();
}

/* ================= modal / utils ================= */
function showModal(html){
  $('#modalhost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Kampvalg">${html}</div></div>`;
}
function closeModal(){ $('#modalhost').innerHTML=''; }
document.addEventListener('keydown',event=>{if(event.key==='Escape') closeModal();});
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* alerts: sound + vibration + flash */
let audioCtx=null;
async function initAudio(){
  if(!alertPrefs().sound) return false;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state!=='running') await audioCtx.resume();
    return audioCtx.state==='running';
  }catch(e){ return false; }
}
function beep(){
  try{
    if(!alertPrefs().sound || audioCtx?.state!=='running') return;
    [0,0.3].forEach(off=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.type='sine';
      g.gain.setValueAtTime(0.001,audioCtx.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.4,audioCtx.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+off+0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+off); o.stop(audioCtx.currentTime+off+0.3);
    });
  }catch(e){}
}
function alertUser(title='Byttetid',body='Åpne Bytteplan for å se kampen.'){
  beep();
  if(alertPrefs().notifications && (!db.pushDevice||pushState==='error')) void showSystemNotification(title,body);
  try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
  const f=$('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

/* Local alerts require a running page; permission is not a background scheduler. */
let alertMessage='', notificationBusy=false, notificationEpoch=0;
function alertPrefs(){
  if(!db.alerts) db.alerts={sound:true,keepAwake:true,notifications:false};
  return db.alerts;
}
function notificationSupported(){
  return window.isSecureContext && typeof Notification!=='undefined' && 'serviceWorker' in navigator;
}
function notificationStateText(){
  if(!notificationSupported()) return 'Systemvarsler er ikke tilgjengelige her. På iPhone/iPad: legg Bytteplan til på Hjem-skjermen og åpne appen derfra. Bruk HTTPS eller localhost.';
  if(Notification.permission==='denied') return 'Varsler er blokkert. Du kan endre tillatelsen i nettleserens eller telefonens innstillinger.';
  if(Notification.permission==='granted') return alertPrefs().notifications?'Varseltillatelse er gitt. Test at pushvarselet kommer fram.':'Tillatelse er gitt, men systemvarsler er slått av i Bytteplan.';
  return 'Valgfritt: tillat varsler i telefonens varslingssenter.';
}
function alertSettingsHtml(){
  const a=alertPrefs();
  return `<div class="card"><h2 style="margin-top:0">Lyd og varsler før avspark</h2>
    <p class="hint">Klokka oppdateres når du låser opp telefonen. Slå på pushvarsler for byttetid, periodeslutt og pauseslutt også når telefonen er låst. Nett og telefoninnstillinger kan forsinke varsler.</p>
    <label class="row"><input type="checkbox" ${a.keepAwake?'checked':''} onchange="setAlertPref('keepAwake',this.checked)"> Hold skjermen våken under kampen</label>
    <p class="hint">${'wakeLock' in navigator?'Virker mens appen er synlig. Manuell låsing og strømsparing kan stoppe dette.':'Denne nettleseren støtter ikke skjermlås-funksjonen. Juster automatisk skjermlås på telefonen ved behov.'}</p>
    <label class="row"><input type="checkbox" ${a.sound?'checked':''} onchange="setAlertPref('sound',this.checked)"> Lyd når det er byttetid</label>
    <button class="ghost big" style="margin-top:10px" onclick="testAlertSound()">Test lyd</button>
    <p class="hint">Skru opp volumet. Lydtesten gjelder når appen er åpen; den gir ikke tilgang til å spille lyd på låst telefon.</p>
    <p class="hint">${notificationStateText()}</p>
    <div class="row"><button class="grow" onclick="enableNotifications()" ${!notificationSupported()||notificationBusy||(typeof Notification!=='undefined'&&Notification.permission==='denied')?'disabled':''}>${notificationBusy?'Venter på tillatelse …':a.notifications?'Test pushvarsel':'Tillat og test pushvarsler'}</button>
    ${a.notifications||db.pushDevice?`<button class="ghost" onclick="setAlertPref('notifications',false)">Slå av</button>`:''}</div>
    <p class="hint">Pushvarsler krever nett. Telefonen bestemmer varsellyd og følger lydløs-/Fokus-innstillinger. Ved aktivering lagres enhetens pushabonnement og varseltidene på serveren. Ingen spillernavn sendes.</p>
    <p class="hint" role="status">${esc(alertMessage)}</p><p class="hint" id="push-status" role="status">${pushStatusText()}</p>
  </div>`;
}
function refreshAlertSettings(){ const el=$('#alert-settings'); if(el) el.innerHTML=alertSettingsHtml(); updateWakeStatus(); }
function setAlertPref(key,value){
  alertPrefs()[key]=value; save();
  if(key==='keepAwake'){ if(value) requestWakeLock(); else releaseWakeLock(); }
  if(key==='notifications'&&!value){clearMatchNotifications(); void disconnectPush();}
  if(key==='sound'&&value) void initAudio();
  refreshAlertSettings();
}
async function testAlertSound(){
  alertPrefs().sound=true; save();
  const ready=await initAudio();
  if(ready) beep();
  alertMessage=ready?'Testlyden er sendt. Hørte du to pip? Sjekk volumet hvis ikke.':'Kunne ikke starte lyd. Prøv igjen med appen åpen.';
  refreshAlertSettings();
}
async function enableNotifications(){
  if(!notificationSupported()||notificationBusy) return;
  notificationBusy=true;
  try{
    // Invoke synchronously from the button gesture, before awaiting SW readiness.
    const permission=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;
    alertPrefs().notifications=permission==='granted'; save();
    if(permission==='granted') await connectPush();
    else alertMessage='Varsler ble ikke slått på. Du kan fortsatt bruke kampen med appen åpen.';
  }catch(e){ pushState='error'; alertMessage='Kunne ikke koble til pushserveren. Kontroller nett, åpne appen fra Hjem-skjermen og prøv igjen. Pushvarsler krever at du bruker appen på adressen der pushserveren er satt opp.'; }
  finally{ notificationBusy=false; refreshAlertSettings(); }
}
async function showSystemNotification(title,body,test=false){
  if(!notificationSupported()||Notification.permission!=='granted'||!alertPrefs().notifications) return false;
  const epoch=notificationEpoch;
  try{
    const registration=await navigator.serviceWorker.getRegistration();
    if(!registration?.active) throw new Error('Service worker not active');
    if(epoch!==notificationEpoch||!alertPrefs().notifications) return false;
    await registration.showNotification(title,{
      body,icon:'icon-192.png',tag:test?'bytteplan-test':'bytteplan-match',
      renotify:true,silent:!alertPrefs().sound,
      data:{url:registration.scope}
    });
    if(test) alertMessage='Testvarsel sendt. Sjekk varslingssenteret; telefonen bestemmer om lyd spilles.';
    return true;
  }catch(e){
    alertMessage='Systemvarselet kunne ikke sendes. Last inn appen på nytt og prøv testen igjen.';
    refreshAlertSettings(); return false;
  }
}
async function clearMatchNotifications(){
  notificationEpoch++;
  try{
    if(!('serviceWorker' in navigator)) return;
    const reg=await navigator.serviceWorker.getRegistration();
    const list=await reg?.getNotifications({tag:'bytteplan-match'});
    list?.forEach(n=>n.close());
  }catch(e){}
}

/* Server schedules only the next substitution and the current period/break.
   Every change replaces the schedule with a monotonically increasing revision. */
let pushState='off', pushSyncedSignature=null, pushInFlight=false, pushAgain=false, pushRetryAt=0;
function pushStatusText(){
  if(pushState==='error'&&!alertPrefs().notifications) return 'Deaktivering er ikke bekreftet · gamle varsler kan fortsatt komme';
  if(typeof Notification!=='undefined'&&Notification.permission==='denied') return 'Varsler er blokkert på telefonen · åpne innstillinger for å tillate dem';
  if(!alertPrefs().notifications) return 'Pushvarsler er av · bruk appen åpen for byttevarsler';
  if(pushState==='error') return 'Varselplanen er ikke bekreftet · behold appen åpen. Tidligere varsler kan fortsatt komme.';
  if(!db.pushDevice) return 'Push er ikke tilkoblet · test og aktiver før avspark';
  if(pushState==='syncing') return 'Oppdaterer varseltider … vent før du låser telefonen';
  return pushState==='ready'?'Varselplanen er lagret på serveren · nett og telefoninnstillinger påvirker levering':'Kobler til pushserveren …';
}
function updatePushStatus(){const el=$('#push-status');if(el)el.textContent=pushStatusText();}
function pushPlan(){
  const m=db.match;
  if(!alertPrefs().notifications||!m||m.finished)return [];
  const id=kind=>`${m.startedAt}:${m.period}:${kind}`;
  if(m.awaitingPeriod)return m.breakEndsAt>Date.now()?[{id:id('break'),kind:'break',at:Math.round(m.breakEndsAt)}]:[];
  if(!m.running)return [];
  const anchor=m.lastTickAt??Date.now();
  const end=Math.round(anchor+(periodLength(m)-m.clockSec)*1000);
  const sub=Math.round(anchor+(m.lastSubTotal+m.intervalSec+m.snoozeSec-m.totalSec)*1000);
  const events=[];
  if(sub<end&&sub>Date.now()-60000)events.push({id:id('sub')+':'+(m.lastSubTotal+m.intervalSec+m.snoozeSec),kind:'sub',at:sub});
  events.push({id:id('end'),kind:m.period===m.periods?'end':'period',at:end});
  if(m.period<m.periods)events.push({id:id('break'),kind:'break',at:end+(m.breakSec??300)*1000});
  return events.filter(e=>e.at>Date.now()-60000);
}
async function pushRequest(path,method='GET',data,authenticated=false){
  const response=await fetch('/api/push/'+path,{
    method,cache:'no-store',credentials:'same-origin',keepalive:method!=='GET',
    headers:{'Content-Type':'application/json',...(authenticated?{Authorization:'Bearer '+db.pushDevice.token}:{})},
    ...(data===undefined?{}:{body:JSON.stringify(data)}),signal:AbortSignal.timeout(12000)
  });
  if(!response.ok){const error=new Error('Push request failed');error.status=response.status;throw error;}
  return response.json();
}
async function connectPush(){
  const config=await pushRequest('config');
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg?.active)throw new Error('Reload to activate service worker');
  const raw=atob(config.publicKey.replace(/-/g,'+').replace(/_/g,'/'));
  const key=Uint8Array.from(raw,c=>c.charCodeAt(0));
  let subscription=await reg.pushManager.getSubscription();
  if(!subscription)subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  if(!db.pushDevice){
    db.pushDevice=await pushRequest('register','POST',{subscription:subscription.toJSON()});
    // Persist the capability before any schedule can be created.
    localStorage.setItem(LS_KEY,JSON.stringify(db));
  }
  try{await pushRequest('devices/'+db.pushDevice.id+'/test','POST',{},true);}
  catch(error){
    if(error.status!==401&&error.status!==410)throw error;
    // Expired server record/subscription: obtain a fresh endpoint and capability.
    await subscription.unsubscribe();
    subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    db.pushDevice=await pushRequest('register','POST',{subscription:subscription.toJSON()});
    localStorage.setItem(LS_KEY,JSON.stringify(db));
    await pushRequest('devices/'+db.pushDevice.id+'/test','POST',{},true);
  }
  alertMessage='Push-test sendt fra serveren. Sjekk varslingssenteret. Telefonen bestemmer om lyd spilles.';
  pushSyncedSignature=null;pushRetryAt=0;await queuePushSync();
}
async function disconnectPush(){
  if(!db.pushDevice)return;
  try{
    await pushRequest('devices/'+db.pushDevice.id,'DELETE',{},true);
    const reg=await navigator.serviceWorker.getRegistration();
    await (await reg?.pushManager.getSubscription())?.unsubscribe();
    db.pushDevice=null;pushState='off';pushSyncedSignature=null;save();
    alertMessage='Pushabonnement og planlagte varsler er slettet fra serveren.';
  }catch(e){pushState='error';alertMessage='Kunne ikke slette pushabonnementet. Tidligere varsler kan fortsatt komme. Prøv Slå av igjen når du har nett.';}
  refreshAlertSettings();
}
async function queuePushSync(){
  if(!db.pushDevice)return;
  const events=pushPlan();
  const signature=JSON.stringify({events,silent:!alertPrefs().sound});
  if(signature===pushSyncedSignature||Date.now()<pushRetryAt)return;
  if(pushInFlight){pushAgain=true;return;}
  pushInFlight=true;pushState='syncing';updatePushStatus();
  const device=db.pushDevice;
  try{
    const revision=++device.revision;
    localStorage.setItem(LS_KEY,JSON.stringify(db));
    await pushRequest('devices/'+device.id,'PUT',{revision,events,silent:!alertPrefs().sound},true);
    if(db.pushDevice===device){pushSyncedSignature=signature;pushState='ready';pushRetryAt=0;}
  }catch(e){if(db.pushDevice===device){pushState='error';pushRetryAt=Date.now()+5000;}}
  finally{pushInFlight=false;updatePushStatus();if(pushAgain){pushAgain=false;void queuePushSync();}}
}
window.addEventListener('online',()=>{pushRetryAt=0;void queuePushSync();});
setInterval(()=>{void queuePushSync();},5000);

/* Wake lock prevents automatic locking only while visible; never manual locking. */
let wakeLock=null, wakePending=false, wakeEpoch=0, wakeFailure=false;
function needsWakeLock(){ return alertPrefs().keepAwake && db.match && !db.match.finished && (db.match.running||db.match.awaitingPeriod); }
function wakeStatusText(){
  if(!alertPrefs().keepAwake) return 'Skjermen kan låses automatisk · varsler kan utebli ved låsing';
  if(wakeLock&&!wakeLock.released) return 'Skjermen holdes våken · behold appen åpen';
  if(!('wakeLock' in navigator)||wakeFailure) return 'Kan ikke holde skjermen våken · hold telefonen ulåst for varsler';
  return needsWakeLock()?'Skjermen holdes ikke våken nå · behold appen åpen':'Klokka er pauset · skjermen kan låses';
}
function updateWakeStatus(){ const el=$('#awake-status'); if(el) el.textContent=wakeStatusText(); }
async function requestWakeLock(){
  if(!needsWakeLock()||document.visibilityState!=='visible'||!('wakeLock' in navigator)||wakeLock||wakePending) return;
  wakePending=true; const epoch=wakeEpoch;
  try{
    const lock=await navigator.wakeLock.request('screen');
    if(epoch!==wakeEpoch||!needsWakeLock()||document.visibilityState!=='visible'){ await lock.release(); return; }
    wakeLock=lock; wakeFailure=false;
    lock.addEventListener('release',()=>{if(wakeLock===lock) wakeLock=null; updateWakeStatus();});
  }catch(e){ wakeFailure=true; }
  finally{ wakePending=false; updateWakeStatus(); }
}
function releaseWakeLock(){
  wakeEpoch++; const lock=wakeLock; wakeLock=null;
  if(lock) void lock.release().catch(()=>{});
  updateWakeStatus();
}
window.addEventListener('pagehide',()=>{ tick(); save(); });
document.addEventListener('visibilitychange',()=>{
  tick(); save();
  refreshAlertSettings();
  if(document.visibilityState==='visible' && db.match && (db.match.running || db.match.awaitingPeriod)) requestWakeLock();
});

/* service worker for offline use */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',event=>{if(event.data?.type==='OPEN_MATCH'){tick();go('kamp');}});
}

tick();
render();
if(needsWakeLock()) void requestWakeLock();
</script>
