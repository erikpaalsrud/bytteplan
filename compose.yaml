services:
  app:
    build: .
    image: bytteplan:local
    restart: unless-stopped
    env_file: ${BYTTEPLAN_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/push.sqlite
    volumes:
      - push_data:/app/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  push_data:
  caddy_data:
  caddy_config:
